<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ===== Social share card (Open Graph + Twitter) =====
     The picture and the sentence a link to this page shows in a feed. The
     same pair on every page of the site: the walk's own poster, and the one
     headline the share buttons send as text -- so a link previews the same
     way whether it was pasted or shared from a button. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.sylfoisy.com/news.html">
<meta property="og:title" content="Walking 250 miles from NYC to DC">
<meta property="og:description" content="News and recent activity from Syl Foisy.">
<meta property="og:image" content="https://wesitefoisy1.b-cdn.net/full_scroll.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Walking 250 miles from NYC to DC">
<meta name="twitter:description" content="News and recent activity from Syl Foisy.">
<meta name="twitter:image" content="https://wesitefoisy1.b-cdn.net/full_scroll.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- ===========================================================================
     NEWS

     A list, and deliberately nothing more. Every other page on this site has a
     job that needs machinery -- a map, a reader, a game -- and this one has a
     job that needs a <ul>: say what happened and when, newest first. Adding a
     filter, a tag system or a "load more" to a page with six entries on it costs
     the reader nothing and costs you every future edit.

     TO ADD AN ENTRY: copy one <li> block, put it at the TOP of the list, change
     the date and the words. That is the whole workflow. The date and the text
     are two separate elements so the dates line up down the page as a column
     rather than running into the sentences beside them.

     A YEAR HEADING is optional. Start one when the list gets long enough that
     scanning it stops being instant -- there is a commented-out example below.
     ========================================================================= -->
<style>
:root{
  --navy:#0d0b2e;--deep:#1a1760;--mid:#2e2a8a;--purple:#2e7dd4;
  --lavender:#a89fd8;--pale:#e8e5f8;--fog:#f4f2ff;
  --white:#fff;--text:#1a1830;--muted:#6b6882
}
*{margin:0;padding:0;box-sizing:border-box}
/* AUTO, not smooth. An in-page link is a jump: the reader has already decided where they
   want to be, and animating the trip there makes them wait to arrive somewhere they chose.
   It also made every menu click on this site feel slower than the click before it, because
   the animation's length depends on how far down the page the target happens to be.

   Deliberate animations are unaffected -- those pass behavior:'smooth' explicitly at the
   call site, which beats this. This only governs what the browser does on its own. */
html{scroll-behavior:auto}
body{font-family:'DM Sans',sans-serif;color:var(--text);background:var(--white);line-height:1.65;-webkit-font-smoothing:antialiased}

/* NAV -- the same bar as the rest of the site, base rules copied from index.html so this
   page needs nothing from anywhere else. The colour block at the foot of the file paints it. */
nav{background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--pale);padding:0 3rem 0 5.25rem;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100}
.nav-name{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--deep);text-decoration:none}
/* 2.5rem, the same on every page. It was 1.5 on the home page and the news page and 2.5
   on the walk and the blog, which reads as the bar subtly resizing itself as you move
   around the site. The wider figure wins because these labels are uppercase and letter-
   spaced: tight gaps make ABOUT MUSIC BLOG NEWS run together into one word.
   KNOB: this gap. If a seventh item is ever added, check it still fits at 900px before
   the hamburger takes over. */
.nav-links{display:flex;gap:2.5rem}
.nav-links a{font-size:.78rem;font-weight:500;text-decoration:none;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;transition:.2s}
.nav-links a:hover{color:var(--purple)}
.nav-hamburger{display:none;flex-direction:column;gap:4px;background:none;border:none;cursor:pointer;padding:.5rem}
.nav-hamburger span{width:22px;height:2px;background:var(--deep);transition:.3s}
.nav-hamburger.active span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.nav-hamburger.active span:nth-child(2){opacity:0}
.nav-hamburger.active span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.nav-mobile-menu{display:none;flex-direction:column;background:var(--white);border-bottom:1px solid var(--pale);padding:.5rem 0;position:sticky;top:58px;z-index:99}
.nav-mobile-menu.open{display:flex}
.nav-mobile-menu a{padding:.85rem 1.5rem;font-size:.9rem;font-weight:500;text-decoration:none;color:var(--text);border-bottom:1px solid var(--pale)}

/* MASTHEAD -- the same solid navy as the home page's hero, so the two tops match. */
.news-head{background:#0f1e35;padding:3.25rem 4rem 2.75rem}
.news-head h1{font-family:'Playfair Display',serif;font-size:clamp(2.1rem,4vw,3rem);font-weight:700;color:var(--white);letter-spacing:-.02em;line-height:1.1}
/* Unused as it stands -- the masthead is the word "News" and nothing else. Kept because a
   line of standfirst under the heading is one <p> away if it ever wants one. */
.news-head p{color:rgba(255,255,255,.72);font-size:.98rem;font-weight:300;margin-top:.6rem;max-width:46ch}

/* THE LIST ---------------------------------------------------------------
   A two-column grid per row: the date in the left column, the entry in the right.
   grid rather than a float or an inline date, so every date starts at the same x
   however long the entry beside it runs -- which is the whole reason a list of
   dated things is readable at a glance.
   KNOB: --date-col is that column's width. Widen it if you start writing longer
   date labels ("Spring 2026", "May–June 2026"). */
.news{--date-col:9.5rem;max-width:820px;margin:0 auto;padding:3rem 1.5rem 5rem}
.news ul{list-style:none}
.news li{
  display:grid; grid-template-columns:var(--date-col) 1fr; gap:1.25rem;
  padding:1.15rem 0; border-bottom:1px solid var(--pale);
}
.news li:last-child{border-bottom:0}
.news time{
  font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--purple); padding-top:.28rem; white-space:nowrap;
}
.news .entry{font-size:1rem;color:var(--text)}
.news .entry a{color:var(--mid);text-decoration:underline;text-decoration-color:rgba(46,125,212,.4)}
.news .entry a:hover{text-decoration-color:var(--purple)}
/* Optional year divider. */
.news h2{
  font-family:'DM Sans',sans-serif; font-size:.72rem; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  margin:2.5rem 0 .5rem; padding-bottom:.4rem; border-bottom:1px solid var(--pale);
}
/* For an empty list. Unused now there is an entry, and left here for the day the list is
   cleared out or a second one is started. */
.news .empty{color:var(--muted);font-style:italic}

footer{background:#08071e;padding:2rem 4rem;display:flex;align-items:center;justify-content:space-between}
footer .fname{font-family:'Playfair Display',serif;color:#fff;font-size:.9rem}
footer .fcredit{font-size:.72rem;color:#fff;letter-spacing:.02em}

@media(max-width:900px){
  .news-head{padding:2.25rem 1.5rem 2rem}
  footer{padding:1.5rem;flex-direction:column;gap:.5rem;text-align:center}
}
/* On a phone the date sits ABOVE its entry rather than beside it: a 9.5rem column out of a
   360px screen is a third of the width given to two words. */
@media(max-width:600px){
  .news li{grid-template-columns:1fr;gap:.2rem}
  .news time{padding-top:0}
}

/* ===== THE SKY BEHIND THE PAGE =============================================
   The same backdrop blog.html sits on -- back2.jpg, pinned to the width of the
   page and as tall as the document, so it travels up with the page rather than
   sitting still behind it. The two files now read as one place, which is the
   point: News and Blog are next to each other in the bar and were two different
   rooms.

   A pseudo-element rather than background-attachment:fixed, because iOS Safari
   quietly ignores that. The navy under it is the fallback while the JPEG loads
   and the floor under any transparency -- dark, because the type is white now.

   min-height:100vh as well as height:100%: height resolves against <html>'s own
   box, and <html> is only as tall as its content. This page is a masthead, one
   entry and a footer, so that box ends above the fold and the strip underneath
   would be flat navy. The two together mean "the taller of the document and the
   window". */
html{background:#16243d;position:relative}
html::before{
  content:"";
  position:absolute; top:0; left:0; width:100%;
  height:100%; min-height:100vh;
  z-index:-5; pointer-events:none;
  background-color:#16243d;
  background-image:url("https://wesitefoisy1.b-cdn.net/back2.jpg");
  background-repeat:repeat-y;
  background-position:top center;
  background-size:100% auto;
}
/* On a phone a 3:2 picture scaled to a 390px column is a short band that would
   tile every few hundred pixels, so it goes back to covering the VIEWPORT and
   holding still while the page scrolls over it. */
@media(max-width:1100px){
  html::before{position:fixed;height:100%;background-size:cover;background-position:center;background-repeat:no-repeat}
}

/* --- Palette, inverted -----------------------------------------------------
   blog.html's switch, in one line: --pale was the hairline grey used for every
   rule and border, and a grey line on a dark photograph is invisible, so it
   becomes a translucent white and goes on meaning "the faintest thing you can
   still see". The type colours all go white. */
:root{--pale:rgba(255,255,255,.30);--white:#fff;--text:#fff;--muted:#fff;--deep:#fff}
body{background:transparent;color:#fff}

/* The masthead was a solid navy band, which was there to give the white heading
   something dark to sit on. The whole page is that now, so the band comes off and
   the heading sits straight on the sky. */
/* Centred: the page is one heading and a list under it, and a left-set heading
   over a centred list read as the two belonging to different pages. */
.news-head{background:transparent;padding:3.25rem 4rem 1.5rem;text-align:center}
.news-head h1{color:#fff}

/* The dates were the site's blue, which is a dark colour on a dark photograph.
   Lavender is the accent that survives the switch. */
.news time{color:#c9c3ee}
.news .entry{color:rgba(255,255,255,.92)}
.news .entry a{color:#fff;text-decoration-color:rgba(201,195,238,.7)}
.news .entry a:hover{text-decoration-color:#fff}
.news li{border-bottom:1px solid rgba(255,255,255,.22)}
.news h2{color:rgba(255,255,255,.65);border-bottom-color:rgba(255,255,255,.22)}
.news .empty{color:rgba(255,255,255,.6)}

/* Transparent, with a hairline over it, so the sky runs to the bottom of the
   window instead of stopping at a black bar. */
footer{background:transparent;border-top:1px solid rgba(255,255,255,.22)}
footer .fname{color:#fff}
footer .fcredit{color:#fff}

/* ===== BACK ================================================================
   The same control the two games carry, in the same corner: top left, under the
   bar, one press, one step. It is fixed rather than in the flow because it has
   to be reachable from anywhere down a long page -- the whole point of it is
   that you do not have to scroll back up to leave.

   Quiet until you look for it. A third-alpha pill with no fill and no border
   sitting over the page, which brightens and rings on hover. On a narrow screen
   the word folds away and the arrow does the work.
   KNOBS: the 70px clearance (the bar is 58), and the .34 resting alpha. */
.backw{
  position:fixed; left:12px; top:70px; z-index:90;
  display:flex; align-items:center; gap:.4rem; padding:.4rem .7rem;
  border-radius:999px; text-decoration:none; cursor:pointer;
  /* NO PILL AT REST. It was a smoked chip with a hairline and a blur behind it at
     all times, which is a lot of furniture for a control most readers never use --
     and on a page whose subject is a photograph, a permanent box in the corner is
     a box over the photograph. At rest it is a word and an arrow and nothing else;
     the chip is the HOVER state, and it arrives with the cursor.

     The border is transparent rather than absent so the pill does not change size
     when it appears -- a border that comes into being on hover moves the text a
     pixel, and a control that shifts under the cursor feels loose.
     KNOBS: the .72 resting type, and the .55 fill that arrives on hover. */
  color:rgba(255,255,255,.72); font:700 .7rem 'DM Sans',sans-serif; letter-spacing:.02em;
  background:none; border:1px solid transparent;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  transition:color .18s ease, border-color .18s ease, background .18s ease;
}
.backw svg{ width:13px; height:13px; flex:0 0 13px }
.backw:hover{ color:#fff; border-color:rgba(255,255,255,.28); background:rgba(10,20,38,.55) }
.backw:focus-visible{ outline:2px solid #fff; outline-offset:2px }
@media(max-width:600px){ .backw span{ display:none } .backw{ opacity:.8 } }

/* ===== THE LIST, THE WAY THE HOME PAGE SETS IT ============================
   The same entry appears in both places and it should look like the same entry:
   one centred line of type, the date in bold, a run of full stops carrying the
   eye across to the sentence. The only difference is the ink -- white here,
   black there -- because this page is a night photograph and that one is not.

   NO COLOUR ANYWHERE IN THE ROW. The date was the site's blue, then lavender;
   the link's underline was lavender too. On a line of white type each of those
   was the one coloured mark in the row, which is more attention than one dated
   sentence is asking for. currentColor for the underline, so it is the same white
   as the words either side of it and cannot drift.

   The grid is gone with all of it: nothing here is a block, so nothing has an
   edge, and the line wraps the way a sentence does when the window is narrow --
   which is also why the phone rule that stacked the date above the entry is not
   needed. There is nothing to stack. */
.news li{
  display:block; text-align:center;
  padding:1.1rem 0; border-bottom:1px solid rgba(255,255,255,.22);
}
.news li:last-child{ border-bottom:0 }
.news .entry{ font-size:1rem; font-weight:300; color:#fff }
.news .entry time{ font-weight:700; color:#fff }
/* The negative margin cancels the tracking after the LAST stop -- letter-spacing
   adds its gap after every character, including the final one -- so the run ends
   flush against the first letter of the sentence. */
.news .entry .lead{ font-weight:inherit; letter-spacing:.28em; margin-right:-.28em }
.news .entry a{
  color:#fff; font-weight:400;
  text-decoration:underline; text-decoration-color:currentColor;
  text-underline-offset:.15em;
}
.news .entry a:hover{ text-decoration-thickness:2px }
/* The bar lands in the same place on every page because the scrollbar's width is
   always reserved, whether the page is long enough to need one or not. Without
   this, a short page (the blog, the news list) is 15px wider than a long one (the
   walk), and everything measured from the right edge -- the link row, the CV item --
   shifts by that much as you move between them. It reads as the bar twitching. */
html{ scrollbar-gutter:stable }

/* ===== THE FOOTER, ON A PHONE HELD SIDEWAYS =================================
   The two credit lines are pushed to opposite ends of the bar, and the rule that
   stacks and centres them is keyed on max-width:900px -- which a phone in portrait
   clears easily and a phone in LANDSCAPE does not: turned sideways these screens
   measure 844 to 932px, so the larger ones fell through to the desktop layout, with
   the name jammed left and the date jammed right across a bar four inches tall.

   Width was the wrong question. What decides this is whether the bar is wide enough
   for two things at its ends to still read as one credit -- and a landscape phone is
   wide but the rest of the page around it is phone-sized. Matching on the HEIGHT is
   what identifies that case: nothing on a desktop is 560px tall. */
@media (orientation:landscape) and (max-height:560px){
  footer{
    flex-direction:column; align-items:center; justify-content:center;
    gap:.35rem; text-align:center;
  }
}

/* ===== NO BACK PILL ON A PHONE =============================================
   It is a desktop control. A phone has a system Back -- a gesture from the edge on
   both platforms, and a hardware or on-screen button on Android -- and it does exactly
   what this pill does, from wherever your thumb already is. Duplicating it costs a
   corner of a small screen, and on the games and the walk that corner is the picture.

   Both queries are needed and they catch different devices: portrait phones are under
   700px wide, and phones held SIDEWAYS are 844 to 932px wide, which no width rule
   would reach -- but nothing on a desktop is 560px tall.

   Nothing else changes. The pill and its goBack() are untouched for desktop, where
   there is no gesture and the browser's own Back is a small target in a corner of the
   window rather than an edge of the device. */
@media(max-width:700px){ .backw{ display:none } }
@media (orientation:landscape) and (max-height:560px){ .backw{ display:none } }

/* ===== THE BAR IS OPAQUE ON A PHONE =========================================
   Safari repaints the whole page when a video leaves full screen, and a sticky strip
   with a backdrop blur has to re-sample its backdrop on every one of those frames --
   which is the flashing across the menu as the video closes. walk.html went solid for
   the same reason months of rounds ago; this is the rest of the site catching up, on
   phones only, where the blur was buying least and costing most.

   Desktop keeps its glass: there is no video full screen to come back from, and the
   effect is what the bar is for up there.
   KNOB: --nav-solid. It wants to be the colour the glass averages out to. */
@media(max-width:900px){
  nav, .nav-mobile-menu{ --nav-solid:#0f1b2f }
  nav{
    background:var(--nav-solid) !important;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
  .nav-mobile-menu{ background:var(--nav-solid) !important }
}

/* ===== THE BAR, THE SAME AS EVERY OTHER PAGE ===============================
   This page had a bar of its own making: the name inset 3rem instead of 5.25, and the
   link row dropped at 900px instead of 701 with no middle state in between. Both showed
   as movement -- click News from the home page and "Syl Foisy" jumped left, and at a
   half-width window this page had a hamburger while the others still had their links.

   A bar is the one thing on a site that must not move between pages: it is how a reader
   knows they are still in the same place. These are the walk's numbers, which is what
   index.html, blog.html and the two games are already using.

   BETWEEN 701 AND 1100 the row scrolls sideways inside its own box rather than shrinking
   -- all five are still there, in order -- and it stays packed to the right so the bar
   reads the same as it does at full width. Below 701 the row goes and the hamburger
   answers instead. */
@media(min-width:701px) and (max-width:1100px){
  nav{ padding:0 1.25rem; gap:1rem }
  .nav-name{ flex:0 0 auto; white-space:nowrap }
  .nav-links{
    justify-content:flex-end;
    flex:1 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden; gap:1.6rem;
    scrollbar-width:none; -ms-overflow-style:none;
    -webkit-mask-image:linear-gradient(90deg, #000 calc(100% - 22px), transparent);
            mask-image:linear-gradient(90deg, #000 calc(100% - 22px), transparent);
  }
  .nav-links::-webkit-scrollbar{ display:none }
  .nav-links a{ flex:0 0 auto; white-space:nowrap }
}
@media(max-width:700px){
  nav{ padding:0 1.25rem }
  .nav-links{ display:none }
  .nav-hamburger{ display:flex }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-name">Syl Foisy</a>
  <div class="nav-links">
    <a href="index.html#about">About</a>
    <a href="index.html#news">News</a>
    <a href="index.html#blog">Blog</a>
    <a href="index.html#contact">Contact</a>

</div>


<!-- The way back, top left under the bar: one step in this tab. -->
<a class="backw" href="index.html" onclick="return goBack(event)">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
  <span>Back</span>
</a>

<header class="news-head">
  <h1>News</h1>
</header>

<main class="news">
  <ul>

    <!-- ================= ADD NEW ENTRIES AT THE TOP OF THIS LIST =================
         ONE PARAGRAPH PER ENTRY, with the date INSIDE it. It used to be a <time> and a
         <p> side by side in a two-column grid, joined by CSS -- and two elements joined
         by CSS are two elements: they can fall onto two lines and they align only as
         well as the rule says. Written into the sentence they are one run of text that
         cannot come apart. The home page's digest is built the same way, so the two
         match by construction rather than by two stylesheets agreeing.

         Copy a whole <li> and keep the three parts in this order: <time>, the leader
         <span>, then the words. <time datetime="..."> is the machine-readable date --
         YYYY-MM for a month, YYYY-MM-DD for a day -- and is what a browser or a feed
         reader would use; the words a person sees are the ones between the tags.

    <li>
      <p class="entry"><time datetime="2026-05">May 2026</time><span class="lead">.......</span>I walked from NYC to DC! <a href="walk.html">Read the whole thing here</a>.</p>
    </li>

         And a year heading, if the list ever wants one. It goes BETWEEN two </li> and <li>
         rather than inside either:

    <h2>2025</h2>
    ========================================================================== -->

    <li>
      <p class="entry"><time datetime="2026-06-03">June 3, 2026</time><span class="lead">.......</span>I finished walking from NYC to DC! <a href="walk.html">Check it out here</a>. :)</p>
    </li>

  </ul>
</main>

<footer>

</footer>

<script>
function toggleMenu(){
  var m = document.getElementById('mobileMenu');
  var b = document.querySelector('.nav-hamburger');
  m.classList.toggle('open');
  b.classList.toggle('active');
}
</script>

<!-- ===== The bar, in the walk's colours ======================================
     The same four values the other pages carry, last in the document so these
     selectors beat the base rules above by source order alone.
     KNOB: --nav-ink is the type, --nav-bar the glass, --nav-rule the hairline,
     --nav-sheet the phone menu, --nav-under what the bar composites onto where
     the blur is switched off. -->
<style>
nav, .nav-mobile-menu{
  --nav-ink:#fff;
  --nav-bar:rgba(10,20,38,.72);
  --nav-rule:rgba(255,255,255,.30);
  --nav-sheet:rgba(10,20,38,.95);
  /* The colour the bar composites onto where the blur is off. It was the pale blue
     the walk's sky averages to; this page sits on a night photograph now, so it is the
     navy under that instead -- otherwise the narrow bar is lighter than the page. */
  --nav-under:#16243d;
}
nav{ background:var(--nav-bar); border-bottom:1px solid var(--nav-rule) }
@media(max-width:700px){
  nav{ background:linear-gradient(var(--nav-bar), var(--nav-bar)), var(--nav-under) }
}
.nav-name{ color:var(--nav-ink) }
.nav-links a{ color:var(--nav-ink) }
.nav-links a:hover{ color:var(--nav-ink); opacity:.55 }
.nav-links a.current{ color:var(--nav-ink); opacity:.55 }

<!-- ===== visit counter =======================================================
     One page view, counted, plus where it came from. Four lines of work and a
     lot of comment, because the interesting part is what it deliberately does
     NOT do.

     NO COOKIES, NO IDS, NO CONSENT BANNER. Nothing is written to the visitor's
     machine and no identifier is minted, so there is nothing to ask permission
     for and no banner to click past. The trade is real and worth stating: these
     are VIEWS, not people. One reader who opens the walk three times is three.

     WHAT IT SENDS: the page name, and the HOST the visitor came from -- t.co,
     reddit.com, bsky.app -- never the full referring URL, which can carry search
     terms and private paths. Same-site hops (walk -> quiz) resolve to "direct",
     since they are not a new arrival.

     WHERE IT SENDS IT: the comments Worker (comments.sylfoisy.workers.dev),
     which keeps the tallies in the walk-comments D1 database; the stats page
     reads them back from the same place. A static site on GitHub Pages has no
     server of its own, so the count has to live somewhere that does. If the
     Worker is ever down the fetch fails silently -- a reader should never see
     a counter fall over.

     It runs after load and out of the way of everything else: a counter is the
     least important thing on any of these pages. -->
<script>
(function(){
  /* The comments server doubles as the counter -- see /view in comments-worker.js. */
  var COUNTER = 'https://comments.sylfoisy.workers.dev';
  var PAGE = (location.pathname.split('/').pop() || 'index.html').replace(/\.html$/, '');

  function source(){
    if(!document.referrer) return 'direct';
    try{
      var h = new URL(document.referrer).hostname.replace(/^www\./, '');
      return h === location.hostname.replace(/^www\./, '') ? 'direct' : h;
    }catch(e){ return 'direct'; }
  }

  /* ONE request per view. The server files it three ways -- the page, the site the
     visitor came from, and today's date (UTC, decided by the server, so a visitor
     with a wrong clock cannot put a view on the wrong day). */
  function go(){
    if(!COUNTER) return;
    try{
      fetch(COUNTER.replace(/\/$/, '') + '/view?page=' + encodeURIComponent(PAGE) +
            '&from=' + encodeURIComponent(source()),
            { mode:'no-cors', keepalive:true, cache:'no-store' }).catch(function(){});
    }catch(e){}
  }

  if(document.readyState === 'complete') setTimeout(go, 0);
  else window.addEventListener('load', function(){ setTimeout(go, 0); });
})();
</script>
<script>
/* BACK. Wherever you came from -- the home page, the walk, a search result --
   one step back in this tab, which the browser restores complete with the scroll
   position you left it at and without refetching anything. The same function the
   two games carry, word for word.

   history.length > 1 is the only condition. It is false when this page was opened
   in a new tab: there is nothing behind it, back does nothing at all, and the href
   has to carry the press instead -- which is why the link still points at the home
   page, as the sensible place to land for someone who arrived with no history. */
function goBack(e){
  if(history.length > 1){
    e.preventDefault();
    history.back();
    return false;
  }
  return true;
}
</script>
</body>
